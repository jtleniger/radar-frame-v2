[package]
name = "radar-frame-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "E-ink display client for the radar-frame HTTP service"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
embedded-hal = "1"
epd-waveshare = { version = "0.6", default-features = false, features = ["epd2in13_v3"] }
png = "0.18"
rppal = { version = "0.22", features = ["embedded-hal"] }
rust-ini = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "3", features = ["gzip"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
