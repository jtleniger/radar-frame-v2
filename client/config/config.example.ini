[logging]
# Rotated at 100 kB with four backups.
file = radar-frame.log
level = INFO

[server]
# Include the path prefix if the service is mounted below the root.
# Use an IP address or a name in /etc/hosts. The static musl binary does not
# use Avahi/NSS, so a bare .local mDNS name will not resolve.
base_url = http://192.168.1.10:8000/
# Fallback between polls when /status does not provide next_attempt.
poll_seconds = 120
connect_timeout_seconds = 5
request_timeout_seconds = 30

[epaper]
# Decode and log frames without touching SPI/GPIO.
use_noop = false
