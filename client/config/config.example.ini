[logging]
# Rotated at 100 kB with four backups.
file = radar-frame.log
level = INFO

[server]
# Include the path prefix if the service is mounted below the root.
base_url = http://radar-frame.local:8000/
# Fallback between polls when /status does not provide next_attempt.
poll_seconds = 120
connect_timeout_seconds = 5
request_timeout_seconds = 30

[epaper]
# Decode and log frames without touching SPI/GPIO.
use_noop = false
