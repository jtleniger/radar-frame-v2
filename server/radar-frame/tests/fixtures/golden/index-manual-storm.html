<!DOCTYPE html>
<html>
    <head>
        <title>Radar Frame</title>
        <link rel="stylesheet" href="static/style.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
    </head>
    <body>
        <main class="content">
            
<section class="title">
<h1>Radar Frame</h1>
</section>
<section class="current-frame">
    <img src="/frame?debug=true" />
</section>
<section class="info">
    <span>Last Updated</span>
    <span>None</span>
</section>
<section class="settings">
    <form hx-post="/settings" hx-trigger="change" hx-swap="outerHTML">
    <div>
        <span>Mode Selection</span>
        
        <span class="til">(until 2026-10-22 10:30AM)</span>
        
    </div>
    <fieldset>
        <label for="auto" >Auto</label>
        <input type="radio" autocomplete="off" id="auto" name="mode-select" value="Auto" >
        <label for="manual" class="active">Manual</label>
        <input type="radio" autocomplete="off" id="manual" name="mode-select" value="Manual" checked="checked">
    </fieldset>
    <span>Mode</span>
    <fieldset >
        <label for="clear" >Clear</label>
        <input type="radio" autocomplete="off" id="clear" name="mode" value="Clear" >
        <label for="storm" class="active">Storm</label>
        <input type="radio" autocomplete="off" id="storm" name="mode" value="Storm" checked="checked">
    </fieldset>
</form>
</section>

        </main>
    </body>
</html>
