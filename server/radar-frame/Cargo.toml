[package]
name = "radar-frame"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "HTTP API, state machine, and forecast sources for the radar frame"

[dependencies]
askama = "0.16"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "query"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
frame-render = { path = "../frame-render" }
frame-view = { path = "../frame-view" }
quick-xml = "0.37"
reqwest = { version = "0.13", features = ["json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
