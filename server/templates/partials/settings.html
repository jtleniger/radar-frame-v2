<form class="settings-form" hx-post="/settings" hx-trigger="change" hx-swap="outerHTML">
    <fieldset class="segment">
        <legend>Mode selection{% if has_manual_til %} <span class="til">until {{ manual_til }}</span>{% endif %}</legend>
        <div class="segment-options">
            <input type="radio" autocomplete="off" id="auto" name="mode-select" value="Auto" {% if mode_select == "Auto" %}checked="checked"{% endif %}>
            <label for="auto">Auto</label>
            <input type="radio" autocomplete="off" id="manual" name="mode-select" value="Manual" {% if mode_select == "Manual" %}checked="checked"{% endif %}>
            <label for="manual">Manual</label>
        </div>
    </fieldset>
    <fieldset class="segment"{% if mode_select == "Auto" %} disabled="disabled"{% endif %}>
        <legend>Mode</legend>
        <div class="segment-options">
            <input type="radio" autocomplete="off" id="clear" name="mode" value="Clear" {% if mode == "Clear" %}checked="checked"{% endif %}>
            <label for="clear">Clear</label>
            <input type="radio" autocomplete="off" id="storm" name="mode" value="Storm" {% if mode == "Storm" %}checked="checked"{% endif %}>
            <label for="storm">Storm</label>
        </div>
    </fieldset>
</form>
