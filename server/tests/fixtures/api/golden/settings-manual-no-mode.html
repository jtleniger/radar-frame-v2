<form class="settings-form" hx-post="/settings" hx-trigger="change" hx-swap="outerHTML">
    <fieldset class="segment">
        <legend>Mode selection <span class="til">until Oct 22, 10:30 AM</span></legend>
        <div class="segment-options">
            <input type="radio" autocomplete="off" id="auto" name="mode-select" value="Auto" >
            <label for="auto">Auto</label>
            <input type="radio" autocomplete="off" id="manual" name="mode-select" value="Manual" checked="checked">
            <label for="manual">Manual</label>
        </div>
    </fieldset>
    <fieldset class="segment">
        <legend>Mode</legend>
        <div class="segment-options">
            <input type="radio" autocomplete="off" id="clear" name="mode" value="Clear" checked="checked">
            <label for="clear">Clear</label>
            <input type="radio" autocomplete="off" id="storm" name="mode" value="Storm" >
            <label for="storm">Storm</label>
            <input type="radio" autocomplete="off" id="photo" name="mode" value="Photo" >
            <label for="photo">Photo</label>
        </div>
    </fieldset>
</form>
