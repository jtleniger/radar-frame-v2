[package]
name = "frame-view"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Compose the e-ink frames (storm and clear) from radar and forecast data"

[dependencies]
ab_glyph = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
png = "0.18"
tempfile = "3"
resvg = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
png = "0.18"
tempfile = "3"
