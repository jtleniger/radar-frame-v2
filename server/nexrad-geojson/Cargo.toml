[package]
name = "nexrad-geojson"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Create GeoJSON from NEXRAD Archive II Level 2 data"

[dependencies]
bzip2 = "0.6"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
